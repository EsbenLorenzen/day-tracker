# Builds the app on a cloud Mac and uploads an unsigned IPA for sideloading (D02, D04).
name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "analysis/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "analysis/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DayTracker.xcodeproj \
            -scheme DayTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DayTracker.app Payload/
          zip -qry DayTracker-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DayTracker-unsigned-${{ github.run_number }}
          path: DayTracker-unsigned.ipa
          retention-days: 30
