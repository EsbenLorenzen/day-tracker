# XcodeGen spec (D03). CI runs `xcodegen generate` to produce DayTracker.xcodeproj.
name: DayTracker

options:
  bundleIdPrefix: com.esbenlorenzen
  deploymentTarget:
    iOS: "26.0"  # D05
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"  # CI overrides with the run number

packages:
  DayTrackerCore:
    path: Packages/DayTrackerCore  # D10

targets:
  DayTracker:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DayTrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esbenlorenzen.daytracker
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DayTracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme: {}
